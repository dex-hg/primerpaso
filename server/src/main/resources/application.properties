spring.application.name=primerpaso
spring.config.import=optional:file:./.env[.properties][encoding=utf-8]

spring.datasource.url=${PRIMERPASO_BD_URL:jdbc:postgresql://localhost:5432/PrimerPaso}
spring.datasource.username=${PRIMERPASO_BD_USUARIO:postgres}
spring.datasource.password=${PRIMERPASO_BD_CLAVE:}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=never

# Las vistas Thymeleaf y los recursos estáticos se incluyen en el JAR.
spring.web.resources.static-locations=classpath:/static/
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=PRIMERPASO_SESION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${PRIMERPASO_COOKIE_SEGURA:false}
server.tomcat.max-http-form-post-size=32KB
spring.jackson.deserialization.fail-on-unknown-properties=true

# Origenes locales admitidos si el frontend se abre con otro servidor.
primerpaso.cors.origenes=${PRIMERPASO_CORS_ORIGENES:http://localhost:5500,http://127.0.0.1:5500,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8000,http://127.0.0.1:8000}
