<!doctype html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{postulaciones/fragmentos :: cabecera('Mi historial')}"></head>
<body class="panel-page" th:attr="data-ruta-base=@{/}">
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
    <div th:replace="~{fragments/header :: panelHeader('cuenta')}"></div>
    <main class="panel-main container" id="main-content">
        <section id="panel" aria-labelledby="pagina-titulo"
                 th:attr="data-tipo-cuenta=${usuario.tipoCuenta},data-id-usuario=${usuario.idUsuario},data-id-empresa=${usuario.idEmpresa},data-rol-empresa=${usuario.rolEmpresa}">
            <div th:replace="~{postulaciones/fragmentos :: estadoSesion}"></div>
            <div id="panel-contenido" class="postulacion-contenido">
                <div class="panel-bienvenida">
                    <div>
                        <span class="panel-etiqueta"><i class="bi bi-clock-history" aria-hidden="true"></i> Mi cuenta</span>
                        <h1 id="pagina-titulo">Mi historial</h1>
                        <p>Consulta las acciones que realizaste en PrimerPaso.</p>
                    </div>
                </div>
                <nav th:replace="~{fragments/cuenta :: navegacion('historial')}"></nav>

                <section class="panel-tarjeta postulacion-vacio" th:if="${#lists.isEmpty(historial.elementos)}">
                    <h2>No hay acciones en esta página</h2>
                    <p class="mb-0">Tus acciones aparecerán aquí cuando participes en un proceso de selección.</p>
                </section>

                <div class="postulacion-lista">
                    <article class="panel-tarjeta postulacion-tarjeta" th:each="accion : ${historial.elementos}">
                        <div>
                            <h2 class="mt-0" th:text="${accion.titulo()}"></h2>
                            <p class="mb-1"><strong th:text="${accion.tituloVacante}"></strong> · <span th:text="${accion.nombreEmpresa}"></span></p>
                            <time class="postulacion-fecha" th:attr="datetime=${accion.fecha}"
                                  th:text="|${formatoFecha.format(accion.fecha)} (Lima)|"></time>
                        </div>
                        <a class="btn btn-soft" th:if="${accion.idPostulacion != null}"
                           th:href="@{${rutaPostulaciones + '/' + accion.idPostulacion}}">Ver postulación</a>
                        <a class="btn btn-soft" th:if="${accion.idPostulacion == null}"
                           th:href="@{/panel/empresa/vacantes/{id}/editar(id=${accion.idVacante})}">Ver vacante</a>
                    </article>
                </div>

                <nav class="postulacion-paginacion" aria-label="Páginas del historial"
                     th:if="${historial.numero > 0 or historial.haySiguiente}">
                    <a class="btn btn-soft" th:if="${historial.numero > 0}"
                       th:href="@{/cuenta/historial(pagina=${historial.numero - 1})}">Anterior</a>
                    <span th:text="|Página ${historial.numero + 1}|"></span>
                    <a class="btn btn-soft" th:if="${historial.haySiguiente}"
                       th:href="@{/cuenta/historial(pagina=${historial.numero + 1})}">Siguiente</a>
                </nav>
            </div>
            <noscript><p class="panel-aviso">Activa JavaScript para cerrar sesión.</p></noscript>
        </section>
    </main>
    <div th:replace="~{fragments/footer :: authFooter(@{/panel}, 'Volver a mi panel')}"></div>
    <th:block th:replace="~{postulaciones/fragmentos :: scripts}"></th:block>
</body>
</html>
