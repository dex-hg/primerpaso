<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Elige cómo crear tu cuenta en PrimerPaso.">
    <title>Registro | PrimerPaso</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

    <div th:replace="~{fragments/header :: authHeader(@{/iniciar-sesion}, 'Ya tengo una cuenta', false)}"></div>

    <main class="auth-main auth-main-centered" id="main-content">
        <section class="auth-shell role-selection" aria-labelledby="register-title">
            <div class="role-selection-heading">
                <span class="role-selection-icon" aria-hidden="true"><i class="bi bi-person-workspace"></i></span>
                <h1 id="register-title">PrimerPaso</h1>
                <p>Elige el tipo de cuenta que deseas crear.</p>
            </div>

            <div class="row g-4 justify-content-center">
                <div class="col-sm-6">
                    <a class="role-card" th:href="@{/registro-postulante}">
                        <span class="role-card-icon" aria-hidden="true"><i class="bi bi-person"></i></span>
                        <strong>Postulante</strong>
                        <small>Quiero encontrar prácticas y empleos</small>
                    </a>
                </div>
                <div class="col-sm-6">
                    <a class="role-card" th:href="@{/registro-empresa}">
                        <span class="role-card-icon" aria-hidden="true"><i class="bi bi-buildings"></i></span>
                        <strong>Empresa</strong>
                        <small>Quiero publicar oportunidades</small>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: authFooter(@{/}, 'Volver al landing')}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script th:src="@{/js/auth.js}"></script>
</body>
</html>
