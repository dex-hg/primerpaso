<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Página no encontrada en PrimerPaso.">
    <title>Página no encontrada | PrimerPaso</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body class="auth-page">

    <a class="skip-link" href="#main-content">
        Saltar al contenido principal
    </a>

    <div th:replace="~{fragments/header :: authHeader(@{/}, 'Volver al inicio', true)}"></div>

    <main class="auth-main auth-main-centered" id="main-content">
        <section class="auth-shell auth-shell-narrow text-center"
                 aria-labelledby="error-title">

            <div class="auth-page-heading">
                <span class="auth-heading-icon" aria-hidden="true">
                    <i class="bi bi-exclamation-circle"></i>
                </span>

                <h1 id="error-title">Página no encontrada</h1>

                <p>
                    La página que estás buscando no existe o ya no está disponible.
                </p>
            </div>

            <div class="d-grid gap-2">
                <a class="btn btn-primary-custom btn-lg"
                   th:href="@{/}">
                    <i class="bi bi-house me-2" aria-hidden="true"></i>
                    Volver al inicio
                </a>

                <a class="btn btn-soft btn-lg"
                   th:href="@{/iniciar-sesion}">
                    Iniciar sesión
                </a>
            </div>

        </section>
    </main>

    <div th:replace="~{fragments/footer :: authFooter(@{/}, 'Volver al inicio')}"></div>

    <script th:src="@{/js/auth.js}"></script>

</body>
</html>
