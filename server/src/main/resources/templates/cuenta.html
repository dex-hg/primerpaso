<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Consulta tu cuenta de PrimerPaso y administra tu sesión.">
    <title>Tu cuenta | PrimerPaso</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page">
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
    
    <div th:replace="~{fragments/header :: authHeader(@{/}, 'Volver al inicio', true)}"></div>

    <main class="auth-main auth-main-centered" id="main-content">
        <section class="auth-shell auth-shell-narrow" id="cuenta" aria-labelledby="cuenta-title" aria-busy="true">
            <div class="auth-page-heading">
                <span class="auth-heading-icon" aria-hidden="true"><i class="bi bi-person-check"></i></span>
                <h1 id="cuenta-title">Tu cuenta</h1>
                <p>Consulta los datos de tu cuenta y cierra la sesión cuando termines.</p>
            </div>
            <p class="auth-form-status mb-3" id="sesion-estado" role="status" aria-live="polite" aria-atomic="true">Comprobando tu sesión…</p>
            <div id="reintentar-contenedor" hidden>
                <button class="btn btn-primary-custom w-100" id="reintentar-sesion" type="button">Reintentar</button>
            </div>
            <div id="datos-cuenta" hidden>
                <dl class="row gy-2">
                    <dt class="col-sm-4">Nombre</dt>
                    <dd class="col-sm-8 text-break" id="cuenta-nombre"></dd>
                    <dt class="col-sm-4">Correo</dt>
                    <dd class="col-sm-8 text-break" id="cuenta-correo"></dd>
                    <dt class="col-sm-4">Tipo de cuenta</dt>
                    <dd class="col-sm-8" id="cuenta-tipo"></dd>
                </dl>
                <div id="datos-empresa" hidden>
                    <dl class="row gy-2">
                        <dt class="col-sm-4">Empresa</dt>
                        <dd class="col-sm-8 text-break" id="cuenta-empresa"></dd>
                        <dt class="col-sm-4">Rol en la empresa</dt>
                        <dd class="col-sm-8 text-break" id="cuenta-rol"></dd>
                    </dl>
                </div>
                <p class="small text-secondary mb-4">La carga de CV y la gestión de vacantes se habilitarán en una próxima etapa.</p>
                <button class="btn btn-primary-custom btn-lg w-100" id="cerrar-sesion" type="button">Cerrar sesión</button>
            </div>
            <noscript><p>Activa JavaScript para comprobar tu sesión y consultar tu cuenta.</p></noscript>
        </section>
    </main>
    
    <div th:replace="~{fragments/footer :: authFooter(@{/}, 'Volver al inicio')}"></div>

    <script th:src="@{/js/auth.js}"></script>
    <script th:src="@{/js/sesion.js}"></script>
</body>
</html>
