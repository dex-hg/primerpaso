# Usa el host exacto de Connect. Puerto de conexión directa o del pooler de sesión.
spring.datasource.url=jdbc:postgresql://${PRIMERPASO_SUPABASE_HOST}:5432/postgres?sslmode=verify-full
spring.datasource.username=primerpaso_app${PRIMERPASO_SUPABASE_SUFIJO_USUARIO:}
spring.datasource.password=${PRIMERPASO_SUPABASE_CLAVE}
spring.datasource.hikari.data-source-properties[sslrootcert]=${PRIMERPASO_SUPABASE_CA}
spring.datasource.hikari.connection-init-sql=SET search_path TO primerpaso, pg_temp
spring.datasource.hikari.minimum-idle=1

# Spring sirve páginas y API desde el mismo origen.
primerpaso.cors.origenes=
server.servlet.session.cookie.secure=${PRIMERPASO_SUPABASE_COOKIE_SEGURA:true}
