# Activar después de supabase: SPRING_PROFILES_ACTIVE=supabase,render
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=none
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=200
server.tomcat.connection-timeout=10s
server.tomcat.use-relative-redirects=true
server.servlet.session.cookie.secure=true

# Render termina TLS y Cloudflare sobrescribe CF-Connecting-IP en su Web Service público.
primerpaso.seguridad.hsts=true
primerpaso.seguridad.proxy-render=true
primerpaso.seguridad.exigir-clave=true
primerpaso.cors.origenes=

primerpaso.registro.postulantes=${PRIMERPASO_REGISTRO_POSTULANTES:false}
primerpaso.registro.empresas=${PRIMERPASO_REGISTRO_EMPRESAS:false}

spring.datasource.hikari.data-source-properties[connectTimeout]=5
spring.datasource.hikari.data-source-properties[socketTimeout]=10
